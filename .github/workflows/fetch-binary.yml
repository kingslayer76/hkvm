name: Fetch HKVM Binary
on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0ddfc-hkvm
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0ddfc-hkvm
      - name: Download binary from tmpfiles
        run: |
          echo "Downloading from tmpfiles.org..."
          curl -L -o hkvm_binary https://tmpfiles.org/dl/1790434643.6157720d67dd3043/wDwFpbnK2qyF/hkvm.bin
          ls -lh hkvm_binary
          sha256sum hkvm_binary || true
          file hkvm_binary || true
          echo "Size: $(stat -c%s hkvm_binary)"
          strings hkvm_binary | grep -i "pyinstaller" | head -5 || true
          strings hkvm_binary | grep -iE "https?://" | sort -u | head -100 || true
          strings hkvm_binary | grep -i "hkvm" | head -20 || true
          strings hkvm_binary | grep -i "8080" | head -20 || true
          strings hkvm_binary | grep -i "license" | head -50 || true
      - name: Install tools
        run: |
          pip install --quiet pyinstxtractor || pip install --quiet --break-system-packages pyinstxtractor || true
          # Try to get pyinstxtractor.py directly
          curl -L -o pyinstxtractor.py https://raw.githubusercontent.com/extremecoders-re/pyinstxtractor/master/pyinstxtractor.py
          ls -lh pyinstxtractor.py
      - name: Extract with pyinstxtractor
        run: |
          python3 pyinstxtractor.py hkvm_binary || true
          ls -R | head -200
          find . -name "*.pyc" | head -50
          ls -lh hkvm_binary_extracted/ 2>/dev/null | head -100
      - name: List extracted files
        run: |
          find hkvm_binary_extracted -type f | head -100
          ls -lh hkvm_binary_extracted/ | head -100
      - name: Try decompile with decompyle3
        run: |
          pip install --quiet decompyle3 uncompyle6 || true
          find hkvm_binary_extracted -name "*.pyc" -exec sh -c 'echo "=== $1 ==="; python3 -m decompyle3 "$1" 2>&1 | head -100' _ {} \; | head -500
      - name: Save report
        run: |
          mkdir -p report
          strings hkvm_binary | grep -iE "https?://" | sort -u > report/urls.txt || true
          strings hkvm_binary | grep -i "pyinstaller" > report/pyinstaller.txt || true
          find hkvm_binary_extracted -type f > report/files.txt || true
          ls -R hkvm_binary_extracted > report/tree.txt 2>&1 || true
          cat report/urls.txt
          cat report/files.txt | head -100
      - name: Commit report
        run: |
          git config user.name "arena-bot"
          git config user.email "bot@arena.ai"
          git add report/ || true
          git commit -m "Add binary analysis report" || true
          git push origin arena/01a0ddfc-hkvm || echo "push failed"
      - name: Upload extracted as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hkvm-extracted
          path: hkvm_binary_extracted
          retention-days: 1
