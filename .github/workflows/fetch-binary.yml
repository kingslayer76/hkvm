name: Fetch HKVM Binary
on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0ddfc-hkvm
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0ddfc-hkvm
      - name: Download binary
        run: |
          curl -L -o hkvm_binary https://files.catbox.moe/4rnuvl
          ls -lh hkvm_binary
          file hkvm_binary
          sha256sum hkvm_binary
      - name: Deep analysis
        run: |
          mkdir -p report
          file hkvm_binary > report/file.txt
          ls -lh hkvm_binary > report/ls.txt
          strings hkvm_binary | grep -iE "https?://" | sort -u > report/urls.txt || true
          strings hkvm_binary | grep -i "pyinstaller\|MEI\|_MEI\|PyInstaller" > report/pyinstaller.txt || true
          strings hkvm_binary | grep -i "hkvm\|HKVM\|8080\|5000\|license" | sort -u > report/branding.txt || true
          strings hkvm_binary | grep -i "flask\|werkzeug\|jinja\|import\|from" | head -100 > report/flask.txt || true
          echo "=== URLs ==="
          cat report/urls.txt | head -100
          echo "=== Branding ==="
          cat report/branding.txt | head -200
          echo "=== PyInstaller ==="
          cat report/pyinstaller.txt | head -50
          echo "=== File ==="
          cat report/file.txt
      - name: Try pyinstxtractor
        run: |
          curl -L -o pyinstxtractor.py https://raw.githubusercontent.com/extremecoders-re/pyinstxtractor/master/pyinstxtractor.py
          python3 pyinstxtractor.py hkvm_binary || true
          ls -lh
          find . -type d -name "*extracted*" | head -20
          if [ -d "hkvm_binary_extracted" ]; then
            find hkvm_binary_extracted -type f | sort > report/files.txt
            ls -R hkvm_binary_extracted > report/tree.txt 2>&1
            echo "Found $(wc -l < report/files.txt) files"
          else
            echo "No extracted dir"
            echo "No extracted dir" > report/files.txt
            echo "No extracted dir" > report/tree.txt
          fi
      - name: Generate full report
        run: |
          cat report/file.txt > report/full.txt
          echo "" >> report/full.txt
          echo "=== URLs ===" >> report/full.txt
          cat report/urls.txt >> report/full.txt
          echo "" >> report/full.txt
          echo "=== Branding ===" >> report/full.txt
          cat report/branding.txt >> report/full.txt
          echo "" >> report/full.txt
          echo "=== PyInstaller ===" >> report/full.txt
          cat report/pyinstaller.txt >> report/full.txt
          echo "" >> report/full.txt
          echo "=== Files ===" >> report/full.txt
          cat report/files.txt >> report/full.txt
          echo "" >> report/full.txt
          echo "=== Tree ===" >> report/full.txt
          cat report/tree.txt >> report/full.txt
          cat report/full.txt | head -2000
      - name: Commit report via git
        run: |
          git config user.name "arena-bot"
          git config user.email "bot@arena.ai"
          git add report/
          git commit -m "Update binary analysis report" || echo "No changes to commit"
          git push origin arena/01a0ddfc-hkvm || echo "Push failed"
