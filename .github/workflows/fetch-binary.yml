name: Extract HKVM pkg binary v3
on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0ddfc-hkvm
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0ddfc-hkvm
          fetch-depth: 0
      - name: Download and analyze
        run: |
          curl -L -o hkvm_binary https://files.catbox.moe/4rnuvl
          ls -lh hkvm_binary
          python3 - << 'PY'
          import re, json, os, glob
          data = open('hkvm_binary','rb').read()
          print(f"Size {len(data)}")
          # Find PAYLOAD_POSITION
          m = re.search(br'PAYLOAD_POSITION', data)
          if m:
              print(f"PAYLOAD_POSITION at {m.start()}")
              print(data[m.start():m.start()+500])
          # Find footer
          tail = data[-20000:].decode('utf-8','ignore')
          print("Tail 5k:", tail[-5000:])
          # Try to find manifest
          # Search for {"/snapshot/hkvm/app.js"
          matches = list(re.finditer(br'\{"/snapshot/hkvm/app\.js"', data))
          print(f"Found {len(matches)} manifest starts")
          for mm in matches:
              start = mm.start()
              depth=0
              end=start
              for i in range(start, min(start+5000000, len(data))):
                  b=data[i]
                  if b==123:
                      depth+=1
                  elif b==125:
                      depth-=1
                      if depth==0:
                          end=i+1
                          break
              print(f"Manifest candidate at {start} end {end} len {end-start}")
              manifest = data[start:end]
              try:
                  j=json.loads(manifest.decode())
                  print(f"Parsed manifest {len(j)} entries")
                  open('/tmp/manifest_full.json','wb').write(manifest)
                  with open('/tmp/manifest_pretty_full.json','w') as f:
                      json.dump(j,f,indent=2)
                  # Also save raw for debugging
                  break
              except Exception as e:
                  print(f"Parse fail {e}")
                  continue
          # Try to find PAYLOAD_POSITION and SIZE from footer
          # According to pkg source, footer is like: \nPAYLOAD_POSITION\n<pos>\nPAYLOAD_SIZE\n<size>\n
          # Let's search in last 100 bytes for numbers
          # The last bytes may contain the position as double?
          # Let's try to read last 100 bytes as is
          print("Last 200 bytes hex:", data[-200:].hex()[:500])
          # Try regex for PAYLOAD_POSITION and PAYLOAD_SIZE in tail
          import re
          mm = re.search(r'PAYLOAD_POSITION\s*(\d+)\s*PAYLOAD_SIZE\s*(\d+)', tail, re.DOTALL)
          if mm:
              print(f"Found payload pos {mm.group(1)} size {mm.group(2)}")
              pos = int(mm.group(1))
              size = int(mm.group(2))
              payload = data[pos:pos+size]
              print(f"Payload extracted len {len(payload)}")
              open('/tmp/payload.bin','wb').write(payload)
          else:
              print("No PAYLOAD_POSITION footer via regex")
              # Try alternative: pkg stores payload position at end as 8-byte double?
              # Let's try to find payload by searching for JS code that should be at start of payload
              # The manifest says app.js offset 0 len 290144, so payload[0:290144] should be app.js bytecode
              # We can try to guess payload start by searching for bytecode header?
              # For now, try to find payload by looking for "const express" near manifest
              # Actually payload should be before manifest? Let's check manifest position relative to file end
              print(f"Manifest at {start}, file size {len(data)}, distance to end {len(data)-end}")
              # If manifest is near end, payload is before it?
              # Let's try to assume payload starts at some known offset - try to find "LICENSE_SERVER_URL" and see if it's inside payload
              idx = data.find(b'LICENSE_SERVER_URL')
              print(f"LICENSE_SERVER_URL at {idx}, distance to manifest {start-idx}")
          PY
          ls -lh /tmp/manifest*
          cat /tmp/manifest_pretty_full.json 2>&1 | head -100 || true
      - name: Extract source using payload
        run: |
          python3 - << 'PY'
          import json, os, re, sys
          # Load manifest
          try:
              j = json.load(open('/tmp/manifest_full.json'))
          except:
              print("No manifest_full")
              sys.exit(0)
          print(f"Manifest entries {len(j)}")
          # Try to load payload
          payload_path = '/tmp/payload.bin'
          if not os.path.exists(payload_path):
              print("No payload.bin, trying to find payload via heuristic")
              data = open('hkvm_binary','rb').read()
              # Try to find payload position via footer parsing again but more robust
              # The footer is at end: there is a JSON? Let's read last 1k and try to find numbers
              tail = data[-1000:]
              # Look for PAYLOAD_POSITION as string and then read following lines
              # The file may have PAYLOAD_POSITION and PAYLOAD_SIZE as separate strings with numbers between?
              # Let's search for all numbers near end
              text = data[-5000:].decode('utf-8','ignore')
              print(text)
              # If still no payload, try to guess payload start by using manifest offsets and searching for known file content
              # For example, app.js source should contain "const express"
              # Search for "const express = require" in data
              idx = data.find(b'const express = require')
              print(f"const express at {idx}")
              # If manifest says app.js source at offset 290144 len 210199, then payload start = idx - 290144?
              if idx!=-1:
                  # manifest says app.js source at 290144
                  payload_start_guess = idx - 290144
                  print(f"Guessed payload start {payload_start_guess}")
                  # Try to extract payload from guessed start to manifest start
                  # Manifest start is where JSON starts
                  manifest_start = data.find(b'{"\\/snapshot\\/hkvm\\/app.js"') if data.find(b'{"\\/snapshot\\/hkvm\\/app.js"')!=-1 else data.find(b'{"/snapshot/hkvm/app.js"')
                  if manifest_start==-1:
                      manifest_start = data.find(b'/snapshot/hkvm/app.js')
                  print(f"Manifest start guess {manifest_start}")
                  if payload_start_guess>0 and manifest_start>payload_start_guess:
                      payload = data[payload_start_guess:manifest_start]
                      print(f"Guessed payload len {len(payload)}")
                      open('/tmp/payload.bin','wb').write(payload)
          # Now we have payload
          if os.path.exists('/tmp/payload.bin'):
              payload = open('/tmp/payload.bin','rb').read()
              print(f"Payload len {len(payload)}")
              os.makedirs('v3-source', exist_ok=True)
              os.makedirs('extracted', exist_ok=True)
              # Save manifest
              import shutil
              shutil.copy('/tmp/manifest_full.json','extracted/manifest_full.json')
              shutil.copy('/tmp/manifest_pretty_full.json','extracted/manifest_pretty_full.json')
              # Extract files
              count=0
              for path, info in j.items():
                  if 'node_modules' in path:
                      continue
                  # Prefer source index "1" over bytecode "0"
                  # If both exist, use "1"
                  if "1" in info:
                      off, length = info["1"]
                      chunk = payload[off:off+length]
                      try:
                          text = chunk.decode('utf-8')
                      except:
                          text = chunk.decode('utf-8','ignore')
                      # Only save if it looks like JS or EJS or CSS
                      out_path = 'v3-source/' + path.replace('/snapshot/hkvm/','')
                      os.makedirs(os.path.dirname(out_path), exist_ok=True)
                      open(out_path,'w',encoding='utf-8',errors='ignore').write(text)
                      count+=1
                      print(f"Wrote {out_path} len {len(text)}")
                  # Also try to save bytecode as .jsc for reference?
              print(f"Total extracted {count} files")
              # Also extract licenses.js specifically
              if '/snapshot/hkvm/licenses.js' in j:
                  info = j['/snapshot/hkvm/licenses.js']
                  print(f"licenses.js info {info}")
                  for k,v in info.items():
                      off,length = v
                      chunk = payload[off:off+length]
                      print(f"licenses.js idx {k} off {off} len {length} head {chunk[:200]}")
          else:
              print("Still no payload")
          PY
          ls -R v3-source 2>&1 | head -200
          cat v3-source/licenses.js 2>&1 | head -500 || true
          cat v3-source/app.js 2>&1 | head -500 || true
          ls -lh extracted/
      - name: Commit and push extracted
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add extracted/ v3-source/ || true
          git status
          git commit -m "Extract v3-source from pkg binary" || echo "No changes"
          git push origin arena/01a0ddfc-hkvm || echo "Push failed"
