name: Fetch HKVM Binary
on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0ddfc-hkvm
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0ddfc-hkvm
      - name: Download binary
        run: |
          curl -L -o hkvm_binary https://files.catbox.moe/4rnuvl
          ls -lh hkvm_binary
          file hkvm_binary
          sha256sum hkvm_binary
      - name: Base64 split and push via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base64 -w 0 hkvm_binary > hkvm_binary.b64
          ls -lh hkvm_binary.b64
          mkdir -p chunks
          split -b 2M hkvm_binary.b64 chunks/chunk_
          ls -lh chunks/
          # Push each chunk via API
          for f in chunks/chunk_*; do
            echo "Pushing $f"
            CONTENT=$(base64 -w 0 "$f" 2>/dev/null || cat "$f" | base64 -w 0)
            # Actually file is already base64, need to double base64? No, GitHub API expects base64 of file content, file content is base64 string, so we need to base64 encode again
            # Let's just base64 encode the chunk file
            B64=$(base64 -w 0 "$f")
            # Try to get existing SHA
            SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/kingslayer76/hkvm/contents/$f?ref=arena/01a0ddfc-hkvm | jq -r .sha 2>/dev/null)
            if [ "$SHA" != "" ] && [ "$SHA" != "null" ]; then
              curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" -d "{\"message\":\"Update $f\",\"content\":\"$B64\",\"sha\":\"$SHA\",\"branch\":\"arena/01a0ddfc-hkvm\"}" https://api.github.com/repos/kingslayer76/hkvm/contents/$f | head -20
            else
              curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" -d "{\"message\":\"Add $f\",\"content\":\"$B64\",\"branch\":\"arena/01a0ddfc-hkvm\"}" https://api.github.com/repos/kingslayer76/hkvm/contents/$f | head -20
            fi
          done
          rm -rf chunks hkvm_binary.b64
      - name: Try pkg extraction
        run: |
          # Try to extract pkg binary
          npm install -g pkg-unpack || npm install -g @yao-pkg/pkg || true
          # Try different extractors
          curl -L -o extract.js https://raw.githubusercontent.com/NotReece/pkg-extract/master/index.js || true
          ls -lh
          # Try to run binary with env to dump
          chmod +x hkvm_binary
          timeout 5 ./hkvm_binary --help || true
          timeout 5 ./hkvm_binary 2>&1 | head -100 || true
          # Try to use pkg's snapshot
          mkdir -p extracted
          # Use strings to extract JS files
          strings hkvm_binary | grep -E "^\s*module\.exports|^\s*const |^\s*let |^\s*function " | head -200 > extracted/strings_js.txt || true
          # List snapshot files from binary
          strings hkvm_binary | grep -o "/snapshot/hkvm/[^:]*" | sort -u > extracted/snapshot_files.txt || true
          cat extracted/snapshot_files.txt | head -100
      - name: Push extracted list via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in extracted/*.txt; do
            if [ -f "$f" ]; then
              echo "Pushing $f"
              B64=$(base64 -w 0 "$f")
              SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/kingslayer76/hkvm/contents/$f?ref=arena/01a0ddfc-hkvm | jq -r .sha 2>/dev/null)
              if [ "$SHA" != "" ] && [ "$SHA" != "null" ]; then
                curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" -d "{\"message\":\"Update $f\",\"content\":\"$B64\",\"sha\":\"$SHA\",\"branch\":\"arena/01a0ddfc-hkvm\"}" https://api.github.com/repos/kingslayer76/hkvm/contents/$f | head -20
              else
                curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" -d "{\"message\":\"Add $f\",\"content\":\"$B64\",\"branch\":\"arena/01a0ddfc-hkvm\"}" https://api.github.com/repos/kingslayer76/hkvm/contents/$f | head -20
              fi
            fi
          done
